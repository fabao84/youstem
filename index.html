<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YouSTEM">
<meta name="theme-color" content="#14171b">
<title>YouSTEM</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono.png">
<link rel="icon" href="icono.png">
<style>:root{
  --fondo:#14171b; --panel:#1b1f24; --panel2:#232830; --linea:rgba(255,255,255,.08);
  --texto:#e9edf2; --gris:#8a94a3; --tenue:#5d6673; --acento:#5a8fb5; --verde:#4cd97b; --oro:#ffd76a; --acorde:#7cc4ff;
  --sa-t:env(safe-area-inset-top); --sa-b:env(safe-area-inset-bottom); --sa-l:env(safe-area-inset-left); --sa-r:env(safe-area-inset-right);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;margin:0;height:100%;background:var(--fondo);color:var(--texto);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
body{position:fixed;left:0;right:0;top:0;bottom:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
.pantalla{position:absolute;inset:0;display:none;flex-direction:column;padding:var(--sa-t) var(--sa-r) 0 var(--sa-l)}
.pantalla.activa{display:flex}
.gris{color:var(--gris)}
.icono{width:40px;height:40px;border-radius:12px;font-size:24px;line-height:40px;color:var(--texto);flex:none}
.icono:active{background:var(--panel2)}

/* ── login ── */
#pLogin{align-items:center;justify-content:center;padding:24px}
.loginCaja{max-width:340px;text-align:center}
.logo{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.loginCaja h1{margin:16px 0 4px;font-size:30px;letter-spacing:.3px}
.lema{color:var(--gris);margin:0 0 28px;font-size:16px}
.grande{width:100%;padding:15px 18px;border-radius:14px;background:#fff;color:#111;font-weight:650;font-size:17px}
.grande:active{transform:scale(.98)}
.nota{color:var(--gris);font-size:13px;margin:18px 4px 0}
.nota.chica{font-size:11px;color:var(--tenue)}

/* ── biblioteca ── */
.cab{display:flex;align-items:center;gap:10px;padding:8px 12px 6px 14px;flex:none}
.logoChico{width:28px;height:28px;border-radius:7px}
.marca{font-weight:700;font-size:20px;letter-spacing:.2px}
.cuentaBib{margin-left:auto;color:var(--tenue);font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 8px;flex:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border-radius:999px;background:var(--panel2);color:var(--gris);font-weight:600;white-space:nowrap;font-size:14px}
.chip.on{background:var(--texto);color:#111}
.buscar{padding:0 14px 8px;flex:none}
.buscar input{-webkit-user-select:text;user-select:text;width:100%;padding:11px 14px;border-radius:12px;border:0;background:var(--panel2);color:var(--texto);font:inherit;font-size:16px;outline:none}
.estado{padding:28px 24px;color:var(--gris);text-align:center}
.lista{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 6px calc(12px + var(--sa-b))}
.grupoArt{position:sticky;top:0;z-index:1;background:var(--fondo);color:var(--gris);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:12px 10px 5px}
.tema{display:flex;align-items:center;gap:12px;width:100%;padding:8px 8px;border-radius:12px;text-align:left}
.tema:active{background:var(--panel)}
.mini{width:48px;height:48px;border-radius:9px;background:var(--panel2) url("icono.png") center/26px no-repeat;flex:none;overflow:hidden}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.tema .tx{flex:1;min-width:0}
.tit{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--gris);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconos{display:flex;gap:6px;align-items:center;flex:none;font-size:12px}
.ic.guard{color:var(--verde);font-size:10px}

/* ── reproducción: TODO entra en una pantalla ── */
#pRep{padding-bottom:var(--abajo,var(--sa-b))}
.rcab{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 4px;flex:none;height:52px}
#btnVolver{font-size:34px;font-weight:300}
.rtit{flex:1;min-width:0;line-height:1.15}
#rTit{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
#rArt{color:var(--gris);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tono{display:flex;align-items:center;background:var(--panel2);border-radius:12px;flex:none}
.tono button{width:38px;height:38px;font-size:22px;border-radius:12px}
.tono button:active{background:#333a44}
.tonoCaja{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}

.rcuerpo{flex:1;min-height:0;display:flex;flex-direction:column}
.izq{flex:1;min-height:0;display:flex;flex-direction:column}
.der{flex:none;display:flex;flex-direction:column}

.ahora{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:2px 14px 6px;flex:none;gap:8px}
.secPul{display:flex;flex-direction:column;gap:4px;min-width:0}
#seccion{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pulsos{display:flex;gap:5px}
.pulsos i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.14);transition:background .06s}
.pulsos i:first-child{width:11px;height:11px;margin-top:-1px}
.pulsos i.on{background:var(--verde)}
.pulsos i.on:first-child{background:#fff}
.acs2{display:flex;align-items:baseline;gap:10px;justify-content:center}
.acAhora{font-size:34px;font-weight:800;color:var(--verde);letter-spacing:-.5px;min-width:1ch;text-align:center}
.acProx{font-size:17px;color:var(--gris);font-weight:600;white-space:nowrap}
.key{justify-self:end;text-align:right;color:var(--gris);font-size:12px;font-weight:600;padding:8px 10px;margin:-8px -10px;border-radius:10px;cursor:pointer}
.key:active{background:var(--panel2)}
.key.grados span::after{content:" · grados";color:var(--acento)}
.key span:not(:empty)::before{content:"Tono ";font-weight:500}
.key span:empty::before{content:"Cifrado"}

.tele{flex:1;min-height:0;overflow:hidden;position:relative;padding:0 16px;font-size:clamp(19px,5.6vw,38px);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 9%,#000 84%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 9%,#000 84%,transparent 100%)}
.rio{transition:transform .45s cubic-bezier(.25,.8,.3,1);will-change:transform;padding-bottom:60vh}
.fila{margin:0 0 .5em;color:var(--tenue);transition:color .25s,opacity .25s;line-height:1.12}
.fila.pasada{opacity:.45}
.fila.actual{color:var(--texto)}
.fila.letra{font-weight:650}
.w{display:inline-flex;flex-direction:column;vertical-align:bottom;margin-right:.08em}
.w.solo{margin-right:.35em}
.acs{display:flex;gap:.35em;min-height:1.12em;font-size:.6em;line-height:1.5}
.ac{font-weight:800;color:var(--acorde);white-space:nowrap;font-style:normal}
.fila:not(.actual) .ac{color:#4f7fa3}
.ac.suena{color:var(--verde)!important}
.tx.oida{color:var(--oro)}
.fila:not(.actual) .tx.oida{color:inherit}
.fila.sec{display:inline-block;font-size:.5em;font-weight:800;letter-spacing:1.2px;padding:.25em .8em;border-radius:999px;background:var(--panel2);color:var(--gris);margin-bottom:.7em}
.fila.sec.actual{background:#2c3440;color:var(--texto)}
.fila.compases{display:flex;gap:0;margin-bottom:.45em}
.cmp{flex:1 1 0;min-width:0;border-left:2px solid rgba(255,255,255,.14);padding:.08em .35em;display:flex;gap:.4em;align-items:baseline}
.cmp:last-child{border-right:2px solid rgba(255,255,255,.14)}
.cmp .ac{font-size:.82em}
.ac.repite{opacity:.35}
.fila.vacio{color:var(--gris);font-size:.6em;padding-top:2em;text-align:center}

.barra{display:block;width:calc(100% - 28px);height:30px;margin:2px 14px 0;touch-action:none;cursor:pointer}
.transporte{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 12px;flex:none;position:relative}
.tbot{width:44px;height:44px;border-radius:50%;font-size:22px;color:var(--gris);background:var(--panel)}
#btnCuenta{font-size:9px;font-weight:800;letter-spacing:.2px}
.tbot.on{color:#111;background:var(--texto)}
#btnLoop.on{background:var(--acento);color:#fff}
#btnLoop.apagado{opacity:.4}
.play{width:58px;height:58px;border-radius:50%;background:var(--texto);position:relative;flex:none}
.play:active{transform:scale(.95)}
.play .tri{position:absolute;left:23px;top:17px;border-left:18px solid #111;border-top:12px solid transparent;border-bottom:12px solid transparent}
.play .bars{display:none;position:absolute;left:20px;top:19px;width:18px;height:20px;border-left:6px solid #111;border-right:6px solid #111}
.play.sonando .tri{display:none}
.play.sonando .bars{display:block}
.tiempo{position:absolute;right:14px;bottom:2px;font-size:11px;color:var(--tenue);font-variant-numeric:tabular-nums}

.mezcla{display:flex;gap:3px;padding:2px 8px 6px;height:clamp(118px,21dvh,190px);flex:none}
.canal{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;background:var(--panel);border-radius:10px;padding:5px 2px 4px;transition:opacity .2s}
.canal.master{flex:.9 1 0;margin-left:4px;background:#20252c}
.canal.fueraSolo{opacity:.42}
.nom{font-size:10.5px;font-weight:700;color:var(--c);width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.fader{flex:1;width:100%;position:relative;touch-action:none;margin:4px 0}
.riel{position:absolute;left:50%;top:6px;bottom:6px;width:4px;margin-left:-2px;border-radius:3px;background:rgba(255,255,255,.1)}
.rell{position:absolute;left:0;right:0;bottom:0;border-radius:3px;background:var(--c);opacity:.9}
.canal.callada .rell{opacity:.25}
.cero{position:absolute;left:-7px;right:-7px;height:1px;background:rgba(255,255,255,.35)}
.per{position:absolute;left:50%;width:24px;height:12px;margin-left:-12px;border-radius:4px;background:#e9edf2;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.per::after{content:"";position:absolute;left:4px;right:4px;top:5px;height:2px;background:var(--c);border-radius:1px}
.db{font-size:9.5px;color:var(--gris);font-variant-numeric:tabular-nums;height:13px}
.bots{display:flex;gap:3px;width:100%;padding:0 2px;margin-top:3px}
.bots button{flex:1;height:22px;border-radius:6px;background:var(--panel2);font-size:11px;font-weight:800;color:var(--gris);min-width:0}
.bots .m.on{background:#e05a5a;color:#fff}
.bots .s.on{background:#e8c547;color:#111}

/* horizontal: letra a la izquierda, mezcla a la derecha */
@media (orientation:landscape){
  .rcuerpo{flex-direction:row}
  .izq{flex:1.35;min-width:0}
  .der{flex:1;min-width:0;padding-bottom:4px}
  .mezcla{flex:1;height:auto;min-height:0}
  .tele{font-size:clamp(18px,3.1vw,36px)}
  .acAhora{font-size:28px}
}

/* ── capas ── */
.cargando{position:fixed;inset:0;background:rgba(10,12,14,.72);display:none;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cargando.ver{display:flex}
.cargCaja{width:min(300px,80vw);text-align:center;color:var(--texto)}
.giro{width:34px;height:34px;margin:0 auto 14px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#fff;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.cargRiel{height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:12px;overflow:hidden}
#cargBarra{height:100%;width:0;background:var(--texto);transition:width .2s}
.hoja{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:30}
.hoja.ver{display:flex}
.hojaCaja{width:min(520px,100%);background:var(--panel);border-radius:18px 18px 0 0;padding:14px 14px calc(14px + var(--sa-b));display:flex;flex-direction:column;gap:6px;max-height:85dvh}
.hojaTit{display:flex;flex-direction:column;padding:4px 6px 8px;font-weight:700}
.hojaTit .gris{font-weight:400;font-size:13px}
.hojaCaja>button{text-align:left;padding:13px 14px;border-radius:12px;background:var(--panel2);display:flex;flex-direction:column}
.hojaCaja>button .gris{font-size:12px;margin-top:2px}
.hojaCaja .rojo{color:#ff7a7a}
.hojaCaja .cerrar{text-align:center;align-items:center;background:none;color:var(--gris)}
.reg pre{flex:1;overflow:auto;font-size:11px;white-space:pre-wrap;background:#0e1013;padding:10px;border-radius:10px;margin:0;min-height:40dvh}
.fila2{display:flex;gap:8px}.fila2 button{flex:1;padding:12px;border-radius:12px;background:var(--panel2)}
.aviso{position:fixed;left:50%;bottom:calc(24px + var(--sa-b));transform:translate(-50%,20px);background:#2a3038;color:var(--texto);padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:40;max-width:90vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.aviso.ver{opacity:1;transform:translate(-50%,0)}

/* como app de pantalla de inicio: iOS difumina la franja de la hora; la cabecera baja un poco para quedar nítida */
@media (display-mode: standalone){ .pantalla{padding-top:calc(var(--sa-t) + 12px)} }
html.app .pantalla{padding-top:calc(var(--sa-t) + 12px)}
</style>
</head>
<body>

<section id="pLogin" class="pantalla activa">
  <div class="loginCaja">
    <img class="logo" src="icono.png" alt="">
    <h1>YouSTEM</h1>
    <p class="lema">Tus stems, tu letra y tus acordes,<br>en el bolsillo.</p>
    <button id="btnEntrar" class="grande">Entrar con Microsoft</button>
    <p class="nota">Usá la misma cuenta de OneDrive donde YouSTEM guarda tu biblioteca. Solo lee: nunca cambia nada de tu nube.</p>
    <p class="nota chica" id="version"></p>
  </div>
</section>

<section id="pBib" class="pantalla">
  <header class="cab">
    <img class="logoChico" src="icono.png" alt="">
    <div class="marca">YouSTEM</div>
    <div class="cuentaBib" id="cuenta"></div>
    <button id="btnMenu" class="icono" aria-label="Menú">⋯</button>
  </header>
  <nav id="libs" class="chips"></nav>
  <div class="buscar"><input id="q" type="search" placeholder="Buscar canción o artista" autocomplete="off" autocorrect="off" spellcheck="false"></div>
  <div id="estadoBib" class="estado" style="display:none"></div>
  <div id="lista" class="lista"></div>
</section>

<section id="pRep" class="pantalla">
  <header class="rcab">
    <button id="btnVolver" class="icono" aria-label="Biblioteca">‹</button>
    <div class="rtit"><div id="rTit"></div><div id="rArt"></div></div>
    <div class="tono">
      <button id="tonoMenos" aria-label="Bajar tono">−</button>
      <div class="tonoCaja" id="tonoVal" title="Tocar = tono de la Mac">0</div>
      <button id="tonoMas" aria-label="Subir tono">+</button>
    </div>
    <button id="btnMenu2" class="icono" aria-label="Menú">⋯</button>
  </header>
  <div class="rcuerpo">
    <div class="izq">
      <div class="ahora">
        <div class="secPul"><span id="seccion"></span><span id="pulsos" class="pulsos"></span></div>
        <div class="acs2"><span id="acAhora" class="acAhora"></span><span id="acProx" class="acProx"></span></div>
        <div class="key"><span id="tonoKey"></span></div>
      </div>
      <div id="tele" class="tele"><div id="rio" class="rio"></div></div>
    </div>
    <div class="der">
      <canvas id="barra" class="barra"></canvas>
      <div class="transporte">
        <button id="btnCuenta" class="tbot" aria-label="Cuenta">1·2·3·4</button>
        <button id="btnInicio" class="tbot" aria-label="Al inicio">⏮</button>
        <button id="btnPlay" class="play" aria-label="Reproducir"><span class="tri"></span><span class="bars"></span></button>
        <button id="btnLoop" class="tbot" aria-label="Repetir">⟲</button>
        <div id="tiempo" class="tiempo">0:00 / 0:00</div>
      </div>
      <div id="mezcla" class="mezcla"></div>
    </div>
  </div>
</section>

<div id="cargando" class="cargando"><div class="cargCaja"><div class="giro"></div><div id="cargTxt"></div><div class="cargRiel"><div id="cargBarra"></div></div></div></div>

<div id="menu" class="hoja">
  <div class="hojaCaja">
    <div class="hojaTit"><span id="menuVersion"></span><span id="menuUsuario" class="gris"></span></div>
    <button id="menuMac">Volver a la mezcla y el tono de la Mac</button>
    <button id="menuCuenta">Cuenta: 1 compás</button>
    <button id="menuRecargar">Recargar la biblioteca</button>
    <button id="menuBorrar">Borrar canciones guardadas en el iPhone<span id="menuEspacio" class="gris"></span></button>
    <button id="menuRegistro">Ver registro</button>
    <button id="menuSalir" class="rojo">Cerrar sesión</button>
    <button id="menuCerrar" class="cerrar">Cerrar</button>
  </div>
</div>
<div id="panelReg" class="hoja reg"><div class="hojaCaja"><pre id="registro"></pre><div class="fila2"><button id="regCopiar">Copiar</button><button id="regCerrar">Cerrar</button></div></div></div>
<div id="aviso" class="aviso"></div>

<script type="text/plain" id="codigoWorklet">// YouSTEM web — motor de audio (AudioWorklet).
// Mezcla las pistas (Int16 en memoria, para que entren en el iPhone), suma el click y la cuenta,
// y aplica el TONO una sola vez sobre la mezcla (remuestreo + WSOLA), como Rubber Band en la Mac.

const W = 2048, HS = W >> 1, D = 512;          // ventana, salto de síntesis, búsqueda ±D
const VENTANA = (() => { const w = new Float32Array(W); for (let i = 0; i < W; i++) w[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / W); return w; })();

class Fifo {            // estéreo, crece si hace falta
  constructor(cap) { this.L = new Float32Array(cap); this.R = new Float32Array(cap); this.n = 0; }
  reservar(extra) {
    if (this.n + extra <= this.L.length) return;
    let cap = this.L.length * 2; while (cap < this.n + extra) cap *= 2;
    const L = new Float32Array(cap), R = new Float32Array(cap);
    L.set(this.L.subarray(0, this.n)); R.set(this.R.subarray(0, this.n));
    this.L = L; this.R = R;
  }
  descartar(k) {        // saca k del principio
    if (k <= 0) return; if (k >= this.n) { this.n = 0; return; }
    this.L.copyWithin(0, k, this.n); this.R.copyWithin(0, k, this.n); this.n -= k;
  }
}

function sintetizarBeep(sr, dur, f, amp, madera) {
  const n = Math.round(sr * dur), b = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const t = i / sr;
    if (madera) {   // cuenta: bloque de madera grave (mismo timbre que la Mac)
      const f2 = f * 2.76;
      b[i] = (Math.sin(2 * Math.PI * f * t) * 0.75 + Math.sin(2 * Math.PI * f2 * t) * 0.25) * Math.exp(-t * 26) * amp
             + Math.exp(-t * 260) * 0.35 * (amp > 1 ? 1 : 0.7);
    } else {        // click: seno con caída exponencial
      b[i] = Math.sin(2 * Math.PI * f * i / sr) * amp * Math.exp(-6 * i / n);
    }
  }
  return b;
}

class YouStem extends AudioWorkletProcessor {
  constructor() {
    super();
    this.pistas = [];              // {L,R:Int16Array, len, ctl, reg:[[a,b,ctl]], g}
    this.ctl = new Float32Array(64); // ganancia efectiva por control (mute/solo ya aplicados)
    this.largo = 0; this.pos = 0; this.sonando = false;
    this.loopOn = false; this.loopA = 0; this.loopB = 0;
    this.master = 1; this.gMaster = 1;
    this.ratio = 1;
    this.click = { on: false, g: 1, beats: [], fuerte: [], desde: 0, suaveHasta: 0, i: 0 };
    this.cuenta = { desde: 0, hasta: -1, pos: [], fuerte: [] };
    this.bClickF = sintetizarBeep(sampleRate, 0.05, 1568, 0.8, false);
    this.bClickD = sintetizarBeep(sampleRate, 0.05, 1046.5, 0.55, false);
    this.bCuentaF = sintetizarBeep(sampleRate, 0.085, 660, 1.15, true);

  let renovando = null;

  async function g(ruta, opc = {}) {

  async function hijos(ruta) {      // todas las páginas

  const enc = s => s.split('/').map(encodeURIComponent).join('/');
  const rutaItem = (r, sub) => `/drives/${r.drive}/items/${r.id}` + (sub ? `:/${enc(sub)}:` : '');

  async function yo() { return gj('/me?$select=displayName,userPrincipalName'); }

  // ── bibliotecas: la tuya (YouSTEM-<usuario> + YouSTEM Privado) y las de la banda (accesos directos YouSTEM-<otro>) ──
  async function bibliotecas() {
    const raiz = await hijos('/me/drive/root/children?$select=id,name,folder,remoteItem,parentReference');
    const carpeta = it => it.remoteItem ? { drive: it.remoteItem.parentReference.driveId, id: it.remoteItem.id }
                                         : { drive: it.parentReference.driveId, id: it.id };
    const priv = raiz.find(x => !x.remoteItem && x.name.toLowerCase() === 'youstem privado');

    }

      libs.push({ clave: 'b:' + c.drive + ':' + c.id, nombre: x.name.replace(/^youstem-/i, ''), carpeta: x.name, raices: [{ ...c, privada: false }], mia: false });

  // ── catálogo: catalogo/<id>.json (con caché por eTag) + miniaturas ──
  const CAT = 'ys.cat.';

  async function enParalelo(lista, n, fn) {

    return res;
  }

  async function catalogo(lib, progreso) {
    const viejo = leerCache(lib.clave) || { entradas: {} };
    const nuevo = { entradas: {}, fecha: Date.now() };
    const miniaturas = {};
    for (const r of lib.raices) {
      let items;

    const vistas = {};

      const { datos, raiz, privada } = c.entradas[k];

      if (datos.nivel !== 'maximo' && datos.nivel !== 'editado') continue;
      const previa = vistas[datos.id];
      if (previa && (previa.editado || 0) >= (datos.editado || 0)) continue;

  // ── canción: lista de archivos y descarga con caché en el iPhone ──
  async function archivosDe(c) {

  const CACHE = 'youstem-canciones-v1';
  const claveCache = (lib, id, rel) => `https://cache.youstem/${encodeURIComponent(lib)}/${encodeURIComponent(id)}/${rel.split('/').map(encodeURIComponent).join('/')}`;

  async function bajar(item, clave, alAvanzar) {
    const cache = await caches.open(CACHE);

    return s;
  }
  async function borrarTodo() { await caches.delete(CACHE); }
  async function espacio() { try { const e = await navigator.storage.estimate(); return e.usage || 0; } catch { return 0; } }

  return { entrar, atenderVuelta, conectado, salir, token, yo, bibliotecas, catalogo, catalogoGuardado, archivosDe, bajar, enCache,
           guardarManifiesto, idsGuardados, borrarTodo, espacio, claveCache, CLIENTE };
})();

const Audio = {
  ctx: null, nodo: null, sr: 48000, pos: 0, posCt: 0, sonando: false, alTerminar: null,
  async iniciar() {
    if (this.ctx) { if (this.ctx.state !== 'running') await this.ctx.resume().catch(() => {}); return; }
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}   // que suene con el iPhone en silencio
    this.ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'playback' });
    this.sr = this.ctx.sampleRate;
    const codigo = document.getElementById('codigoWorklet').textContent;
    try { await this.ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([codigo], { type: 'application/javascript' }))); }
    catch (e) { anotar('worklet por blob falló, pruebo data:', e); await this.ctx.audioWorklet.addModule('data:application/javascript;charset=utf-8,' + encodeURIComponent(codigo)); }
    this.nodo = new AudioWorkletNode(this.ctx, 'youstem', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
    this.nodo.connect(this.ctx.destination);
    this.nodo.port.onmessage = e => {
      const m = e.data;
      if (m.t === 'pos') { this.pos = m.pos / this.sr; this.posCt = m.ct; this.sonando = m.sonando; }
      else if (m.t === 'fin') { this.sonando = false; this.alTerminar && this.alTerminar(); }
    };
    this.ctx.resume().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (!document.hidden && this.ctx && this.ctx.state !== 'running') this.ctx.resume().catch(() => {}); });
  },
  enviar(m, tr) { this.nodo && this.nodo.port.postMessage(m, tr || []); },
  ahora() {   // posición suave para la pantalla
    if (!this.ctx) return this.pos;
    return this.sonando ? this.pos + Math.max(0, Math.min(0.25, this.ctx.currentTime - this.posCt)) : this.pos;
  },
  async decodificar(buf) {
    return await new Promise((ok, mal) => { const p = this.ctx.decodeAudioData(buf, ok, mal); if (p && p.then) p.then(ok, mal); });
  }
};

    else this.estado('');

  }
};

      Nube.guardarManifiesto(clave('manifiesto'), { raiz: a.raiz.map(x => ({ name: x.name })), pistas: a.pistas.map(x => ({ name: x.name })), dir: a.dirPistas });
    } catch (e) {
      anotar('lista de archivos', e);
      if (e.sinSesion) throw e;
      const m = await Nube.enCache(clave('manifiesto'));
      if (!m) throw new Error('Sin conexión, y esta canción todavía no está guardada en el iPhone.');
      man = JSON.parse(new TextDecoder().decode(m)); man.offline = true;
    }
    if (turno !== abriendo) return;
    const item = (lista, n) => man.offline ? null : lista.find(x => x.name === n);
    const json = async n => {
      if (!man.raiz.find(x => x.name === n)) return null;
      try { return JSON.parse(new TextDecoder().decode(await Nube.bajar(item(man.raiz, n), clave(n)))); } catch (e) { anotar(n, e); return null; }
    };
    const [anJ, leJ, ajJ] = await Promise.all([json('analisis.json'), json('letra.json'), json('ajustes.json')]);

    // qué pistas suenan: stems.json (Editar stems) o las seis de siempre
    let pistas = [];
    const audios = man.pistas.filter(x => /\.(mp3|m4a|flac|wav)$/i.test(x.name));
    const archivoDe = base => audios.find(x => x.name.replace(/\.[^.]+$/, '') === base && /\.mp3$/i.test(x.name)) || audios.find(x => x.name.replace(/\.[^.]+$/, '') === base);
    let compensacion = {};
    if (man.pistas.find(x => x.name === 'stems.json')) {
      try {
        const sj = JSON.parse(new TextDecoder().decode(await Nube.bajar(item(man.pistas, 'stems.json'), clave(man.dir + '/stems.json'))));
        for (const x of sj.pistas || []) { const f = archivoDe(String(x.archivo || '').replace(/^.*\//, '').replace(/\.[^.]+$/, '')); if (f) pistas.push({ id: x.id, nombre: x.nombre || x.id, f }); }
        compensacion = sj.compensacion || {};
      } catch (e) { anotar('stems.json', e); }
    }
    if (!pistas.length) for (const id of ['voz', 'bajo', 'bateria', 'guitarra', 'piano', 'otros']) { const f = archivoDe(id); if (f) pistas.push({ id, nombre: NOMBRES[id], f }); }
    if (!pistas.length) throw new Error('No encontré las pistas Máxima de esta canción en OneDrive.');

    // bajar (o leer del iPhone) y decodificar de a una: así entra en memoria
    const total = pistas.reduce((s, p) => s + (p.f.size || 0), 0) || 1;
    let hecho = 0;
    Audio.enviar({ t: 'vaciar' });
    const cargadas = [];
    for (let i = 0; i < pistas.length; i++) {
      const p = pistas[i];
      if (turno !== abriendo) return;
      const base = hecho;
      const buf = await Nube.bajar(item(man.pistas, p.f.name), clave(man.dir + '/' + p.f.name), (n) => cargando(`Bajando ${p.nombre}…`, Math.min(1, (base + n) / total)));
      hecho += p.f.size || buf.byteLength;
      cargando(`Preparando ${p.nombre}…`, Math.min(1, hecho / total));
      const ab = await Audio.decodificar(buf);
      const n = ab.length, L = new Int16Array(n), R = new Int16Array(n);
      const k = Math.max(1, +compensacion[p.id] || 1);
      const a0 = ab.getChannelData(0), a1 = ab.numberOfChannels > 1 ? ab.getChannelData(1) : a0;
      for (let j = 0; j < n; j++) {
        let x = a0[j] * k * 32767; L[j] = x > 32767 ? 32767 : x < -32768 ? -32768 : x;
        x = a1[j] * k * 32767; R[j] = x > 32767 ? 32767 : x < -32768 ? -32768 : x;
      }
      Audio.enviar({ t: 'pista', i, L, R, len: n }, [L.buffer, R.buffer]);
      cargadas.push({ ...p, largo: n / Audio.sr });
    }
    Nube.guardarManifiesto(clave('manifiesto'), { raiz: man.raiz.map(x => ({ name: x.name })), pistas: man.pistas.map(x => ({ name: x.name })), dir: man.dir });
    Bib.guardadas.add(lib.clave + '|' + c.id);
    if (turno !== abriendo) return;
    cargando(null);
    Rep.mostrar(c, lib, cargadas, Modelo.Analisis.deJson(anJ), Modelo.letraDeJson(leJ), Modelo.ajustesDeJson(ajJ || {}));
    if (man.offline) aviso('Sin conexión: suena la copia guardada en el iPhone.');
  } catch (e) {
    anotar('abrir', c.id, e);
    cargando(null);
    if (e.sinSesion) { sesionVencida(); return; }
    aviso(e.message || String(e), 6000);
  }
}

// ══════════════════════ Reproducción ══════════════════════
const PALETA_ARR = ['#3f6f8f', '#6f4f8f', '#8f5f3f', '#3f8f5f', '#8f3f5f', '#6f6f3f'];
const VolDb = {
  min: -60, max: 6, skew: Math.log(0.5) / Math.log(48 / 66),       // como el slider de la Mac: la mitad = −12 dB
  aPos(g) { const db = g <= 0.001 ? this.min : Math.max(this.min, Math.min(this.max, 20 * Math.log10(g))); return Math.pow((db - this.min) / (this.max - this.min), this.skew); },
  deDb(db) { return db <= this.min + 0.05 ? 0 : Math.pow(10, db / 20); },
  dbDePos(p) { p = Math.max(0, Math.min(1, p)); return this.min + (this.max - this.min) * Math.pow(p, 1 / this.skew); },
  texto(g) { if (g <= 0.001) return '−∞'; const db = 20 * Math.log10(g); if (Math.abs(db) < 0.05) return '0 dB'; return (db > 0 ? '+' : '−') + Math.abs(db).toFixed(1); }
};

const Rep = {
  cancion: null, lib: null, an: null, letra: null, aj: null, filas: [], pistas: [], dur: 0,
  tono: 0, centsRef: 0, filasTele: [], rio: null,

  mostrar(c, lib, pistas, an, letra, aj) {
    this.cancion = c; this.lib = lib; this.an = an; this.letra = letra; this.pistas = pistas;
    this.dur = Math.max(...pistas.map(p => p.largo), 0);
    this.ajMac = aj;
    this.aj = this.conLocal(aj);
    $('#rTit').textContent = c.titulo || c.id;
    $('#rArt').textContent = c.artista || '';
    // "Tocar en": la referencia elegida contra la afinación medida de la grabación
    // (0.0.1, fabao) SIEMPRE a 440, automático y sin botón: la afinación medida de la grabación se lleva a La 440
    this.centsRef = an.afinacionHz > 300 && an.afinacionHz < 500 ? 1200 * Math.log2(440 / an.afinacionHz) : 0;
    this.armarFilas();
    this.armarRegiones();
    this.armarClick();
    this.tono = Math.round(this.aj.tono || 0);
    this.aplicarTono();
    this.aplicarLoop();
    Audio.enviar({ t: 'master', v: this.aj.master });
    this.armarTele();
    this.dibujarMezcla();
    pantalla('pRep');
    this.pos0 = this.aj.marcaInicio > 0.5 ? this.aj.marcaInicio : 0;
    this.ir(this.pos0);
    this.refrescarBotones();
    requestAnimationFrame(() => { this.medir(); this.cuadro(); });
  },

  // ── tus cambios en el iPhone quedan guardados por canción (la Mac no se toca) ──
  claveLocal() { return 'ys.local.' + this.lib.clave + '|' + this.cancion.id; },
  conLocal(aj) {
    const a = { ...aj, ganancias: { ...aj.ganancias }, mutes: new Set(aj.mutes), solos: new Set(aj.solos) };
    let l = null; try { l = JSON.parse(localStorage.getItem(this.claveLocal()) || 'null'); } catch {}
    if (!l) return a;
    Object.assign(a.ganancias, l.ganancias || {});
    if (l.mutes) a.mutes = new Set(l.mutes);
    if (l.solos) a.solos = new Set(l.solos);
    for (const k of ['tono', 'loop', 'cicloIni', 'cicloFin', 'cuenta', 'clickEncendido', 'master']) if (k in l) a[k] = l[k];
    a.local = true;
    return a;
  },
  guardarLocal() {
    const a = this.aj, g = {}, m = [], s = [];
    for (const f of this.filas) { if (f.tipo === 'master') continue; g[f.id] = f.gan; if (f.mute) m.push(f.id); if (f.solo) s.push(f.id); }
    const click = this.filas.find(f => f.tipo === 'click');
    const l = { ganancias: g, mutes: m, solos: s, tono: this.tono, loop: a.loop, cicloIni: a.cicloIni, cicloFin: a.cicloFin, cuenta: a.cuenta,
                clickEncendido: click ? !click.mute : a.clickEncendido, master: a.master };
    try { localStorage.setItem(this.claveLocal(), JSON.stringify(l)); } catch {}
  },
  volverALaMac() {
    try { localStorage.removeItem(this.claveLocal()); } catch {}
    const c = this.cancion, lib = this.lib;
    this.mostrar(c, lib, this.pistas, this.an, this.letra, this.ajMac);
    aviso('Mezcla y tono como en la Mac.');
  },

  // ── filas de la mezcla (grupos, pistas, canales virtuales de los tramos, click, master) ──
  armarFilas() {
    const aj = this.aj, F = [];
    const idx = id => this.pistas.findIndex(p => p.id === id);
    const agrupadas = new Set();
    for (const ids of aj.grupos) {
      const ms = ids.filter(id => idx(id) >= 0 && !agrupadas.has(id));
      if (ms.length < 2) continue;
      const gid = Modelo.idGrupo(ms);
      const v = gid in aj.ganancias ? aj.ganancias[gid] : 1;
      let m = aj.mutes.has(gid), s = aj.solos.has(gid);
      if (!m && !s && !(gid in aj.ganancias)) { m = ms.every(id => aj.mutes.has(id)); s = ms.some(id => aj.solos.has(id)); }
      const nombreBase = ms.map(id => this.pistas[idx(id)].nombre).join(' + ');
      F.push({ id: gid, tipo: 'grupo', nombre: aj.nombresPistas[gid] || nombreBase, color: colorDe(ms[0], aj.colores[gid] || aj.colores[ms[0]]),
               miembros: ms.map(idx), bases: ms.map(id => { const g = id in aj.ganancias ? aj.ganancias[id] : 1; return v > 0.001 ? g / v : g; }),
               gan: v, mute: m, solo: s });
      ms.forEach(id => agrupadas.add(id));
    }
    this.pistas.forEach((p, i) => {
      if (agrupadas.has(p.id)) return;
      F.push({ id: p.id, tipo: 'pista', nombre: aj.nombresPistas[p.id] || p.nombre, color: colorDe(p.id, aj.colores[p.id]), pista: i,
               gan: p.id in aj.ganancias ? aj.ganancias[p.id] : 1, mute: aj.mutes.has(p.id), solo: aj.solos.has(p.id) });
    });
    if (this.an.valido) F.push({ id: 'click', tipo: 'click', nombre: 'Click', color: colorDe('click', aj.colores.click), gan: 'click' in aj.ganancias ? aj.ganancias.click : 1, mute: !aj.clickEncendido, solo: false });
    // canales virtuales: destinos "virtual:N" de los tramos (sin audio propio, solo controles)
    this.virtuales = [];
    for (const t of aj.tramos) if (t.destino.startsWith('virtual:') && !this.virtuales.includes(t.destino)) this.virtuales.push(t.destino);
    this.virtuales.forEach((d, k) => F.push({ id: d, tipo: 'virtual', nombre: aj.nombresPistas[d] || ('Extra ' + d.split(':')[1]), color: colorDe(d, aj.colores[d]),
               ctl: this.pistas.length + k, gan: d in aj.ganancias ? aj.ganancias[d] : 1, mute: aj.mutes.has(d), solo: aj.solos.has(d) }));
    if (aj.ordenPistas.length) {
      const pos = id => { const i = aj.ordenPistas.indexOf(id); return i < 0 ? 1e5 : i; };
      F.sort((a, b) => pos(a.id) - pos(b.id));   // estable: lo no listado queda en su orden
    }
    F.push({ id: 'master', tipo: 'master', nombre: 'Master', color: '#ffffff', gan: aj.master, mute: false, solo: false });
    this.filas = F;
    this.enviarControles();
  },
  enviarControles() {
    const g = new Float32Array(64);
    const algunSolo = this.filas.some(f => f.solo && (f.tipo === 'pista' || f.tipo === 'grupo' || f.tipo === 'virtual'));
    const apagada = f => f.mute || (algunSolo && !f.solo);
    for (const f of this.filas) {
      if (f.tipo === 'pista') g[f.pista] = apagada(f) ? 0 : f.gan;
      else if (f.tipo === 'grupo') f.miembros.forEach((m, k) => { g[m] = apagada(f) ? 0 : f.bases[k] * f.gan; });
      else if (f.tipo === 'virtual') g[f.ctl] = apagada(f) ? 0 : f.gan;
      else if (f.tipo === 'click') Audio.enviar({ t: 'click', c: { on: !f.mute, g: f.gan } });
      else if (f.tipo === 'master') { this.aj.master = f.gan; Audio.enviar({ t: 'master', v: f.gan }); }
    }
    Audio.enviar({ t: 'ctl', g });
  },
  armarRegiones() {
    const sr = Audio.sr, porPista = {};
    for (const t of this.aj.tramos) {
      const i = this.pistas.findIndex(p => p.id === t.pista); if (i < 0) continue;
      let ctl;
      if (t.destino === '@silencio') ctl = -1;
      else if (t.destino.startsWith('virtual:')) ctl = this.pistas.length + this.virtuales.indexOf(t.destino);
      else { ctl = this.pistas.findIndex(p => p.id === t.destino); if (ctl < 0) continue; }
      (porPista[i] = porPista[i] || []).push([Math.round(t.desde * sr), Math.round(t.hasta * sr), ctl]);
    }
    this.pistas.forEach((p, i) => Audio.enviar({ t: 'regiones', i, reg: (porPista[i] || []).sort((a, b) => a[0] - b[0]) }));
  },
  armarClick() {
    const an = this.an; if (!an.valido) return;
    const sr = Audio.sr, beats = an.beatsEfectivos(), comps = an.compasesEfectivos();
    const fuertes = new Set(comps.map(t => Math.round(t * 1000)));
    const compasSeg = comps.length >= 2 ? Math.max(0.8, Math.min(8, comps[1] - comps[0])) : 2;
    const desde = Math.max(0, an.inicioMusica - compasSeg - 0.1), groove = an.grooveDesde >= 0 ? an.grooveDesde : 0;
    const b = beats.filter(t => t >= desde);
    Audio.enviar({ t: 'click', c: { beats: b.map(t => Math.round(t * sr)), fuerte: b.map(t => fuertes.has(Math.round(t * 1000)) ? 1 : 0), desde: 0, suaveHasta: Math.round((groove - 0.05) * sr) } });
  },

  // ── tono ──
  aplicarTono() {
    const r = Math.pow(2, (this.tono * 100 + this.centsRef) / 1200);
    Audio.enviar({ t: 'tono', r: Math.abs(r - 1) < 1e-4 ? 1 : r });
    const txt = (this.tono > 0 ? '+' : this.tono < 0 ? '−' : '') + Math.abs(this.tono);
    $('#tonoVal').textContent = this.tono === 0 ? '0' : txt;
    this.aplicarTonoTexto();
    if (this.rio) this.pintarAcordes();
  },
  aplicarTonoTexto() {
    const tt = Modelo.tonoTranspuesto(this.an.tonoEn(Audio.ahora()), this.tono);
    this.bemol = Modelo.tonoTranspuesto(this.an.tonalidad, this.tono).bemol;   // la ortografía, por el tono de la canción
    $('#tonoKey').textContent = Modelo.lindo(tt.nombre);
  },
  cambiarTono(d) { this.tono = Math.max(-12, Math.min(12, this.tono + d)); this.aplicarTono(); this.guardarLocal(); },
  // cifrado americano o grados (tocando "Tono"); los grados van contra el tono vigente en ese segundo
  nombreAcorde(n, t) {
    if (Pref.get('notacion', 'americana') === 'grados' && !Modelo.esSilencio(n)) {
      const g = Modelo.grado(n, this.an.tonoEn(t == null ? Audio.ahora() : t));
      if (g) return g;
    }
    return Modelo.lindo(Modelo.transponer(n, this.tono, this.bemol));
  },
  cambiarNotacion() {
    const n = Pref.get('notacion', 'americana') === 'grados' ? 'americana' : 'grados';
    Pref.set('notacion', n); this.pintarAcordes(); this.iAc = -2;
    aviso(n === 'grados' ? 'Cifrado en grados (I, IV, V…)' : 'Cifrado americano (C, F, G…)', 1600);
    $('#tonoKey').parentElement.classList.toggle('grados', n === 'grados');
  },

  // ── transporte ──
  aplicarLoop() {
    const a = this.aj, ok = a.loop && a.cicloFin > a.cicloIni + 0.2;
    Audio.enviar({ t: 'loop', on: !!ok, a: a.cicloIni * Audio.sr, b: a.cicloFin * Audio.sr });
    $('#btnLoop').classList.toggle('on', !!ok);
    $('#btnLoop').classList.toggle('apagado', !(a.cicloFin > a.cicloIni + 0.2));
  },
  ir(seg) { Audio.pos = Math.max(0, Math.min(this.dur, seg)); Audio.enviar({ t: 'ir', pos: Audio.pos * Audio.sr }); this.saltoTele = true; },
  async tocar() {
    await Audio.iniciar();
    const a = this.aj, an = this.an;
    let desde = Audio.pos >= this.dur - 0.05 ? 0 : Audio.pos;
    if (a.marcaInicio > 0.5 && !this.reanudar) desde = a.marcaInicio;      // como la Mac: la bandera verde manda
    Audio.enviar({ t: 'cuenta', desde: 0, hasta: -1, pos: [], fuerte: [] });
    if (a.cuenta && an.valido) {
      const destino = a.marcaCuenta >= 0 ? a.marcaCuenta : desde;           // lila = tu entrada; si no, donde arranca
      const comps = an.compasesEfectivos(), nB = Math.max(2, an.compasN), nComp = Pref.get('cuentaCompases', 1);
      let paso = 0;
      for (let i = 0; i + 1 < comps.length; i++) if (comps[i] >= destino - 0.12) { const d = comps[i + 1] - comps[i]; if (d > 0.4 && d < 8) { paso = d / nB; break; } }
      if (paso <= 0 && comps.length >= 2) paso = Math.max(0.8, Math.min(8, comps[1] - comps[0])) / nB;
      if (paso < 0.15 || paso > 2.5) paso = 0.5;
      const total = nComp * nB, pos = [], fuerte = [];
      for (let k = total; k >= 1; k--) { const t = destino - paso * k; if (t >= 0) { pos.push(Math.round(t * Audio.sr)); fuerte.push(k % nB === 0 ? 1 : 0); } }
      const ini = destino - paso * total;
      if (pos.length) {
        Audio.enviar({ t: 'cuenta', desde: Math.max(0, ini) * Audio.sr, hasta: destino * Audio.sr, pos, fuerte });
        desde = a.marcaCuenta >= 0 ? 0 : Math.max(0, ini);   // con lila, como la Mac: desde el principio, sin saltos
      }
    }
    this.ir(desde);
    Audio.enviar({ t: 'play' }); Audio.sonando = true; Audio.posCt = Audio.ctx.currentTime;
    this.reanudar = false;
    pantallaPrendida(true); this.refrescarBotones();
  },
  pausa() { Audio.enviar({ t: 'pausa' }); Audio.sonando = false; pantallaPrendida(false); this.refrescarBotones(); },
  parar() { if (Audio.nodo) Audio.enviar({ t: 'pausa' }); Audio.sonando = false; pantallaPrendida(false); },
  alInicio() { this.reanudar = false; this.ir(this.aj.marcaInicio > 0.5 ? this.aj.marcaInicio : 0); if (Audio.sonando) this.tocar(); },
  refrescarBotones() {
    $('#btnPlay').classList.toggle('sonando', Audio.sonando);
    $('#btnCuenta').classList.toggle('on', !!this.aj.cuenta);
  },

  // ══════════ TELEPROMPTER: letra con los acordes sobre la palabra, y compases sin letra ══════════
  armarTele() {
    const an = this.an, le = this.letra, rio = $('#rio');
    rio.innerHTML = ''; this.rio = rio; this.filasTele = []; this.palabrasEl = []; this.acordesEl = [];
    const acordes = an.valido || an.acordes.length ? an.acordesAlPulso().filter(a => !a.sigue) : [];
    this.acordes = acordes;
    const comps = an.compasesEfectivos(), beats = an.beatsEfectivos();
    // renglones con tiempo, en orden
    const lineas = [];
    le.lineas.forEach((l, i) => { if (l.t >= 0) lineas.push({ ...l, i, pal: le.palabras[i] || [] }); });
    lineas.sort((a, b) => a.t - b.t);
    const filas = [];
    lineas.forEach((l, k) => {
      const sig = k + 1 < lineas.length ? lineas[k + 1].t : this.dur;
      const sec = Modelo.etiquetaSeccion(l.texto);
      if (sec) { filas.push({ tipo: 'sec', t: l.t, fin: sig, texto: sec }); return; }
      let pal = l.pal.filter(w => w.texto && w.texto.trim());
      if (!pal.length) {                  // karaoke estimado: palabras repartidas por largo
        const ws = l.texto.split(/\s+/).filter(Boolean);
        const fin = l.fin > l.t ? l.fin : Math.min(sig, l.t + Math.max(1.2, ws.length * 0.42) * 1.5);
        const peso = ws.map(w => w.length + 1), tot = peso.reduce((a, b) => a + b, 0) || 1;
        let t = l.t; pal = ws.map((w, j) => { const d = (fin - l.t) * peso[j] / tot; const r = { t, fin: t + d, texto: w }; t += d; return r; });
      }
      const finCanto = Math.max(l.fin > 0 ? l.fin : 0, pal.length ? pal[pal.length - 1].fin : l.t + 1.2);
      filas.push({ tipo: 'letra', t: l.t, fin: Math.min(sig, Math.max(finCanto, l.t + 0.5)), sig, pal, acordes: [] });
    });
    // cada acorde va a la palabra que suena en su tiempo; lo que cae lejos del canto va a las filas de compases
    const zonaDe = f => [f.t - 0.35, Math.min(f.sig, f.fin + 0.6)];
    const sueltos = [];
    for (const ac of acordes) {
      if (Modelo.esSilencio(ac.nombre)) continue;
      const f = filas.find(f => f.tipo === 'letra' && ac.t >= zonaDe(f)[0] && ac.t < zonaDe(f)[1]);
      if (f) f.acordes.push(ac); else sueltos.push(ac);
    }
    // compases sin letra: celdas de a cuatro (como la hoja de la ventana de acordes)
    if (comps.length && sueltos.length) {
      const celdas = Modelo.acordesPorCompas(acordes.filter(a => !Modelo.esSilencio(a.nombre)), comps, beats);
      const libre = cel => !filas.some(f => f.tipo === 'letra' && cel.t < zonaDe(f)[1] - 0.05 && cel.fin > zonaDe(f)[0] + 0.05) && cel.acordes.length;
      let tanda = [];
      const cerrar = () => { if (tanda.length) filas.push({ tipo: 'compases', t: tanda[0].t, fin: tanda[tanda.length - 1].fin, celdas: tanda }); tanda = []; };
      celdas.forEach((cel, i) => {
        if (!libre(cel)) { cerrar(); return; }
        if (tanda.length && (tanda.length >= 4 || Math.abs(tanda[tanda.length - 1].fin - cel.t) > 0.05)) cerrar();
        tanda.push(cel);
      });
      cerrar();
    } else if (!comps.length && sueltos.length) {
      for (let i = 0; i < sueltos.length; i += 4) { const g = sueltos.slice(i, i + 4); filas.push({ tipo: 'compases', t: g[0].t, fin: g[g.length - 1].fin, celdas: g.map(a => ({ t: a.t, fin: a.fin, acordes: [a] })) }); }
    }
    filas.sort((a, b) => a.t - b.t);
    if (!filas.length) filas.push({ tipo: 'vacio', t: 0, fin: this.dur, texto: le.valida ? 'La letra de esta canción no tiene tiempos todavía.' : 'Sin letra ni acordes para esta canción.' });

    // ── dibujar ──
    let previo = null;
    for (const f of filas) {
      const d = el('div', 'fila ' + f.tipo);
      if (f.tipo === 'sec') d.textContent = f.texto;
      else if (f.tipo === 'vacio') d.textContent = f.texto;
      else if (f.tipo === 'letra') {
        const porPal = f.pal.map(() => []);
        let antes = [];
        for (const ac of f.acordes) {
          let j = -1; for (let k = 0; k < f.pal.length; k++) if (f.pal[k].t <= ac.t + 0.12) j = k;
          const dest = j < 0 ? antes : porPal[j];
          if (dest.length && dest[dest.length - 1].nombre === ac.nombre) continue;   // el mismo acorde dos veces en la misma palabra: uno
          dest.push(ac);
        }
        if (antes.length) { const w = el('span', 'w solo'); const ca = el('span', 'acs'); antes.forEach(ac => ca.appendChild(this.chipAcorde(ac))); w.appendChild(ca); w.appendChild(el('span', 'tx', '\u00a0')); d.appendChild(w); }
        f.pal.forEach((p, k) => {
          const w = el('span', 'w');
          const ca = el('span', 'acs'); porPal[k].forEach(ac => ca.appendChild(this.chipAcorde(ac)));
          w.appendChild(ca);
          const tx = el('span', 'tx', p.texto); w.appendChild(tx);
          d.appendChild(w); d.appendChild(document.createTextNode(' '));
          this.palabrasEl.push({ el: tx, t: p.t, fin: p.fin });
        });
      } else if (f.tipo === 'compases') {
        let ant = previo && previo.tipo === 'compases' ? previo.ultimo : null;
        for (const cel of f.celdas) {
          const c = el('span', 'cmp');
          for (const ac of cel.acordes) {
            const chip = this.chipAcorde(ac);
            if (cel.acordes.length === 1 && ant === ac.nombre) chip.classList.add('repite');
            c.appendChild(chip); ant = ac.nombre;
          }
          d.appendChild(c);
        }
        f.ultimo = ant;
      }
      f.el = d; rio.appendChild(d); this.filasTele.push(f); previo = f;
    }
    this.palabrasEl.sort((a, b) => a.t - b.t);
    this.acordesEl.sort((a, b) => a.t - b.t);
    this.iFila = -1; this.iPal = -1; this.iAc = -1; this.saltoTele = true;
    this.pintarAcordes();
  },
  chipAcorde(ac) {
    const b = el('b', 'ac'); b.dataset.n = ac.nombre;
    this.acordesEl.push({ el: b, t: ac.t, fin: ac.fin, n: ac.nombre });
    return b;
  },
  pintarAcordes() { for (const a of this.acordesEl) a.el.textContent = this.nombreAcorde(a.n, a.t); this.iAc = -2; $('#tonoKey').parentElement.classList.toggle('grados', Pref.get('notacion', 'americana') === 'grados'); },

  medir() {
    const tele = $('#tele');
    this.altoTele = tele.clientHeight;
    for (const f of this.filasTele) { f.y = f.el.offsetTop; f.h = f.el.offsetHeight; }
    this.saltoTele = true;
  },

  // un cuadro de animación: cabezal, karaoke, acorde que suena, compás y pulso
  cuadro() {
    if (!this.cancion) return;
    requestAnimationFrame(() => this.cuadro());
    if (!$('#pRep').classList.contains('activa')) return;
    const t = Audio.ahora(), an = this.an;
    $('#tiempo').textContent = fmtT(t) + ' / ' + fmtT(this.dur);
    this.dibujarBarra(t);
    // fila actual
    const F = this.filasTele;
    let i = 0; for (let k = 0; k < F.length; k++) if (F[k].t <= t + 0.15) i = k;
    if (i !== this.iFila || this.saltoTele) {
      if (this.iFila >= 0 && F[this.iFila]) F[this.iFila].el.classList.remove('actual');
      F[i].el.classList.add('actual');
      F.forEach((f, k) => f.el.classList.toggle('pasada', k < i));
      const y = (F[i].y || 0) - Math.round(this.altoTele * 0.28);
      const rio = this.rio;
      if (this.saltoTele) { rio.style.transition = 'none'; rio.style.transform = `translateY(${-y}px)`; void rio.offsetHeight; rio.style.transition = ''; }
      else rio.style.transform = `translateY(${-y}px)`;
      this.iFila = i;
    }
    // karaoke (palabra por palabra)
    const P = this.palabrasEl;
    let ip = -1; { let lo = 0, hi = P.length - 1; while (lo <= hi) { const m = (lo + hi) >> 1; if (P[m].t <= t) { ip = m; lo = m + 1; } else hi = m - 1; } }
    if (ip !== this.iPal || this.saltoTele) {
      const a = Math.min(ip, this.iPal), b = Math.max(ip, this.iPal);
      if (this.saltoTele) P.forEach((p, k) => p.el.classList.toggle('oida', k <= ip));
      else for (let k = Math.max(0, a + 1); k <= b && k < P.length; k++) P[k].el.classList.toggle('oida', k <= ip);
      this.iPal = ip;
    }
    // acorde que suena
    const A = this.acordes || [];
    let ia = -1; for (let k = 0; k < A.length; k++) { if (A[k].t <= t + 0.05) ia = k; else break; }
    if (ia !== this.iAc || this.saltoTele) {
      for (const x of this.acordesEl) x.el.classList.toggle('suena', ia >= 0 && Math.abs(x.t - A[ia].t) < 0.01 && x.n === A[ia].nombre);
      const ahora = ia >= 0 ? A[ia] : null;
      let prox = null; for (let k = ia + 1; k < A.length; k++) if (!Modelo.esSilencio(A[k].nombre)) { prox = A[k]; break; }
      $('#acAhora').textContent = ahora ? (Modelo.esSilencio(ahora.nombre) ? 'N.C.' : this.nombreAcorde(ahora.nombre, ahora.t)) : '';
      $('#acProx').textContent = prox ? '→ ' + this.nombreAcorde(prox.nombre, prox.t) : '';
      this.iAc = ia;
    }
    // sección y pulso
    const b = an.arreglo.find(x => t >= x.t - 0.001 && t < x.fin);
    const sec = b ? b.nombre : '';
    if (sec !== this.secTxt) { $('#seccion').textContent = sec; this.secTxt = sec; }
    this.dibujarPulso(t);
    if (an.cambiosTono.length) { const k = an.tonoEn(t); if (k !== this.tonoMostrado) { this.tonoMostrado = k; this.aplicarTonoTexto(); } }
    this.saltoTele = false;
  },
  dibujarPulso(t) {
    const an = this.an, cont = $('#pulsos');
    if (!an.valido) { if (cont.childElementCount) cont.innerHTML = ''; return; }
    const comps = an.compasesEfectivos(), beats = an.beatsEfectivos();
    let ic = -1; for (let k = 0; k < comps.length; k++) { if (comps[k] <= t + 0.03) ic = k; else break; }
    const nB = ic >= 0 ? an.compasEn(comps[ic]) : an.compasN;
    let b = -1;
    if (ic >= 0) { const t1 = ic + 1 < comps.length ? comps[ic + 1] : comps[ic] + an.duracionCompas(); b = beats.filter(x => x >= comps[ic] - 0.03 && x < t1 - 0.03 && x <= t + 0.03).length - 1; }
    if (cont.childElementCount !== nB) { cont.innerHTML = ''; for (let k = 0; k < nB; k++) cont.appendChild(el('i')); }
    const clave = ic + ':' + b;
    if (clave !== this.pulsoClave) { [...cont.children].forEach((d, k) => d.classList.toggle('on', k === b)); this.pulsoClave = clave; }
  },

  // ── barra de posición con la estructura (arreglos), el loop y las banderas ──
  dibujarBarra(t) {
    const cv = $('#barra'), dpr = window.devicePixelRatio || 1;
    const W = cv.clientWidth, H = cv.clientHeight;
    if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
    const x = cv.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, W, H);
    const d = this.dur || 1, X = s => s / d * W;
    x.fillStyle = 'rgba(255,255,255,.08)'; x.fillRect(0, H * 0.25, W, H * 0.5);
    for (const b of this.an.arreglo) {
      x.fillStyle = PALETA_ARR[((b.color % 6) + 6) % 6]; x.fillRect(X(b.t), H * 0.18, Math.max(1, X(b.fin) - X(b.t) - 1), H * 0.64);
      if (X(b.fin) - X(b.t) > 34) { x.fillStyle = 'rgba(255,255,255,.75)'; x.font = '600 10px -apple-system,system-ui'; x.textBaseline = 'middle'; x.fillText(b.nombre.slice(0, 14), X(b.t) + 4, H / 2, X(b.fin) - X(b.t) - 6); }
    }
    const a = this.aj;
    if (a.cicloFin > a.cicloIni + 0.2) { x.fillStyle = a.loop ? 'rgba(90,143,181,.35)' : 'rgba(255,255,255,.10)'; x.fillRect(X(a.cicloIni), 0, X(a.cicloFin) - X(a.cicloIni), H); }
    x.fillStyle = 'rgba(255,255,255,.22)'; x.fillRect(0, H * 0.18, X(t), H * 0.64);
    const bandera = (s, col) => { if (s < 0) return; x.fillStyle = col; x.beginPath(); x.moveTo(X(s), 0); x.lineTo(X(s) + 6, 0); x.lineTo(X(s), 7); x.fill(); x.fillRect(X(s) - 1, 0, 2, H); };
    if (a.marcaInicio > 0.5) bandera(a.marcaInicio, '#4cd97b');
    if (a.marcaCuenta >= 0) bandera(a.marcaCuenta, '#b48ef0');
    x.fillStyle = '#fff'; x.fillRect(X(t) - 1, 0, 2, H);
  },

  // ── mezcla: una columna por fila ──
  dibujarMezcla() {
    const m = $('#mezcla'); m.innerHTML = '';
    for (const f of this.filas) {
      const c = el('div', 'canal ' + f.tipo); c.style.setProperty('--c', f.color);
      c.appendChild(el('div', 'nom', f.nombre));
      const fad = el('div', 'fader'); const riel = el('div', 'riel'); const rell = el('div', 'rell'); const per = el('div', 'per'); const cero = el('div', 'cero');
      riel.appendChild(rell); riel.appendChild(cero); riel.appendChild(per); fad.appendChild(riel); c.appendChild(fad);
      const db = el('div', 'db'); c.appendChild(db);
      const bots = el('div', 'bots');
      let bm = null, bs = null;
      if (f.tipo !== 'master') { bm = el('button', 'm', 'M'); bots.appendChild(bm); }
      if (f.tipo !== 'master' && f.tipo !== 'click') { bs = el('button', 's', 'S'); bots.appendChild(bs); }
      c.appendChild(bots);
      const pintar = () => {
        const p = VolDb.aPos(f.gan);
        rell.style.height = (p * 100) + '%'; per.style.bottom = `calc(${p * 100}% - 7px)`;
        cero.style.bottom = (VolDb.aPos(1) * 100) + '%';
        db.textContent = VolDb.texto(f.gan);
        bm && bm.classList.toggle('on', f.mute); bs && bs.classList.toggle('on', f.solo);
        c.classList.toggle('callada', f.mute);
      };
      f.pintar = pintar; pintar();
      // arrastre vertical; doble toque = 0 dB
      let ultimoToque = 0;
      fad.addEventListener('pointerdown', e => {
        e.preventDefault(); fad.setPointerCapture(e.pointerId);
        const ahora = performance.now();
        if (ahora - ultimoToque < 320) { f.gan = 1; pintar(); this.enviarControles(); this.guardarLocal(); ultimoToque = 0; return; }
        ultimoToque = ahora;
        const r = riel.getBoundingClientRect(), y0 = e.clientY, p0 = VolDb.aPos(f.gan);
        const mover = ev => { const p = p0 + (y0 - ev.clientY) / r.height; f.gan = VolDb.deDb(Math.round(VolDb.dbDePos(p) * 10) / 10); pintar(); this.enviarControles(); };
        const soltar = () => { fad.removeEventListener('pointermove', mover); fad.removeEventListener('pointerup', soltar); fad.removeEventListener('pointercancel', soltar); this.guardarLocal(); };
        fad.addEventListener('pointermove', mover); fad.addEventListener('pointerup', soltar); fad.addEventListener('pointercancel', soltar);
      });
      bm && (bm.onclick = () => { f.mute = !f.mute; pintar(); this.enviarControles(); this.guardarLocal(); });
      bs && (bs.onclick = () => { f.solo = !f.solo; this.filas.forEach(x => x.pintar && x.pintar()); this.pintarSolos(); this.enviarControles(); this.guardarLocal(); });
      m.appendChild(c);
    }
    this.pintarSolos();
  },
  pintarSolos() {
    const algun = this.filas.some(f => f.solo);
    [...$('#mezcla').children].forEach((c, k) => { const f = this.filas[k]; c.classList.toggle('fueraSolo', algun && !f.solo && f.tipo !== 'master' && f.tipo !== 'click'); });
  }
};

// ── controles de Reproducción ──
$('#btnVolver').onclick = () => { Rep.parar(); Rep.refrescarBotones(); pantalla('pBib'); Bib.dibujar(); };
$('#btnPlay').onclick = () => Audio.sonando ? Rep.pausa() : Rep.tocar();
$('#btnInicio').onclick = () => Rep.alInicio();
$('#tonoMenos').onclick = () => Rep.cambiarTono(-1);
$('#tonoMas').onclick = () => Rep.cambiarTono(+1);
$('#tonoKey').parentElement.onclick = () => Rep.cambiarNotacion();
$('#tonoVal').onclick = () => { Rep.tono = Math.round(Rep.ajMac.tono || 0); Rep.aplicarTono(); Rep.guardarLocal(); aviso('Tono como en la Mac.'); };
$('#btnCuenta').onclick = () => { Rep.aj.cuenta = !Rep.aj.cuenta; Rep.refrescarBotones(); Rep.guardarLocal(); aviso(Rep.aj.cuenta ? 'Cuenta prendida' : 'Cuenta apagada', 1400); };
$('#btnLoop').onclick = () => {
  const a = Rep.aj;
  if (!(a.cicloFin > a.cicloIni + 0.2)) { aviso('Mantené apretada una parte de la barra (Intro, Coro…) para repetirla.'); return; }
  a.loop = !a.loop; Rep.aplicarLoop(); Rep.guardarLocal();
};
Audio.alTerminar = () => { Rep.reanudar = false; Rep.refrescarBotones(); pantallaPrendida(false); };

// barra: tocar = ir ahí; mantener apretado sobre una parte del arreglo = repetir esa parte
(() => {
  const cv = $('#barra'); let tLargo = null, x0 = 0, arrastrando = false;
  const seg = e => { const r = cv.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * Rep.dur; };
  cv.addEventListener('pointerdown', e => {
    cv.setPointerCapture(e.pointerId); x0 = e.clientX; arrastrando = false;
    const s = seg(e);
    tLargo = setTimeout(() => {
      tLargo = null;
      const b = Rep.an.arreglo.find(x => s >= x.t && s < x.fin);
      if (b) { Rep.aj.cicloIni = b.t; Rep.aj.cicloFin = b.fin; Rep.aj.loop = true; Rep.aplicarLoop(); Rep.guardarLocal(); aviso('Repitiendo: ' + (b.nombre || 'esta parte')); if (navigator.vibrate) navigator.vibrate(20); }
    }, 550);
  });
  cv.addEventListener('pointermove', e => { if (Math.abs(e.clientX - x0) > 8) { arrastrando = true; if (tLargo) { clearTimeout(tLargo); tLargo = null; } Rep.ir(seg(e)); } });
  cv.addEventListener('pointerup', e => { if (tLargo) { clearTimeout(tLargo); tLargo = null; Rep.reanudar = true; Rep.ir(seg(e)); } else if (arrastrando) Rep.reanudar = true; });
})();

addEventListener('resize', () => { if (Rep.cancion) requestAnimationFrame(() => Rep.medir()); });
addEventListener('orientationchange', () => setTimeout(() => Rep.cancion && Rep.medir(), 300));

}

document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
// (0.0.3) LA PANTALLA SE MIDE SOLA. Siempre se usa el área que el iPhone realmente muestra (nada de suponer el alto
// de la pantalla: en la 0.0.2 eso cortaba la mezcla). Como app de pantalla de inicio, iOS a veces deja la página más
// corta que la pantalla y entonces no hay barra de inicio debajo: se saca el margen de abajo para ganar ese lugar.
function ajustarAlto() {
  const app = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  const raiz = document.documentElement;
  raiz.classList.toggle('app', app);
  const sonda = document.createElement('div');
  sonda.style.cssText = 'position:fixed;left:0;top:0;bottom:0;width:1px;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);visibility:hidden;pointer-events:none';
  document.body.appendChild(sonda);
  const cs = getComputedStyle(sonda), alto = sonda.getBoundingClientRect().height;
  const saT = parseFloat(cs.paddingTop) || 0, saB = parseFloat(cs.paddingBottom) || 0;
  sonda.remove();
  const horiz = matchMedia('(orientation: landscape)').matches;
  const pantalla = horiz ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
  const faltaAbajo = app && saB > 0 && alto < pantalla - saB * 0.8;   // la página no llega hasta la barra de inicio
  raiz.style.setProperty('--abajo', faltaAbajo ? '4px' : 'var(--sa-b)');
  const linea = `pantalla: app=${app} alto=${Math.round(alto)} inner=${innerHeight} vv=${Math.round(window.visualViewport ? visualViewport.height : 0)} screen=${pantalla} saT=${saT} saB=${saB} → margen abajo ${faltaAbajo ? 'no' : 'sí'}`;
  if (linea !== ajustarAlto.ultima) { ajustarAlto.ultima = linea; anotar(linea); }
  if (Rep.cancion) requestAnimationFrame(() => Rep.medir());
}
ajustarAlto(); addEventListener('resize', ajustarAlto); addEventListener('orientationchange', () => setTimeout(ajustarAlto, 250));
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
arrancar();
